<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset-katalógus – Das Deutsch-Abenteuer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<!--
  Fejlesztői oldal: a repóban lévő összes grafika kereshetően és szűrhetően, és hogy melyikből van már tárgy a játékban.
  Adat: assets/catalog_data.js (generált: python3 tools/asset_catalog/build.py), data/bundle.js (a játék tárgyai),
  src/config/config.js (ritkaság-színek). Megnyitás: catalog.html (file://-ról is), vagy a raw.githack linkkel.
-->
<style>
  @font-face {
    font-family: 'DA Ziffern';
    src: url(https://fonts.gstatic.com/s/pressstart2p/v16/e3t4euO8T-267oIAQAu6jDQyK3nVivM.woff2) format('woff2');
    unicode-range: U+0030-0039; size-adjust: 72%; font-display: swap;
  }
  :root {
    --bg: #1d1a22; --panel: #2a2530; --card: #342e3c; --line: #4a4256; --ink: #f3ead8; --soft: #b9ad9c;
    --accent: #f2c040; --green: #6fcf5a;
    --font: 'DA Ziffern', 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.35 var(--font); }
  header {
    background: var(--panel); border-bottom: 2px solid var(--line);
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
  }
  h1 { margin: 0 0 8px; font-size: 22px; }
  h1 small { font-size: 14px; color: var(--soft); font-weight: 400; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  input[type=search], select {
    font: 600 16px var(--font); color: var(--ink); background: var(--card); border: 2px solid var(--line);
    border-radius: 8px; min-height: 44px; padding: 6px 10px;
  }
  input[type=search] { flex: 1 1 220px; }
  select { flex: 1 1 160px; min-width: 0; max-width: 100%; }
  .card { scroll-margin-top: 12px; }
  .chip {
    font: 600 15px var(--font); color: var(--ink); background: var(--card); border: 2px solid var(--line);
    border-radius: 999px; min-height: 40px; padding: 4px 12px; cursor: pointer;
  }
  .chip.on { background: var(--accent); color: #2a1d10; border-color: var(--accent); }
  main { padding: 12px max(12px, env(safe-area-inset-right)) 40px max(12px, env(safe-area-inset-left)); }
  .count { color: var(--soft); font-size: 14px; margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; }
  .card {
    background: var(--card); border: 2px solid var(--line); border-radius: 8px; padding: 8px 6px; text-align: center;
    cursor: pointer; display: grid; justify-items: center; gap: 4px; min-width: 0; font: inherit; color: inherit;
  }
  .card.used { border-color: var(--rarity, var(--green)); box-shadow: inset 0 0 0 2px var(--rarity, var(--green)); }
  .thumb { width: 64px; height: 64px; display: grid; place-items: center; }
  .thumb > * { image-rendering: pixelated; }
  .icon { width: 48px; height: 48px; background-repeat: no-repeat; }
  .file { max-width: 64px; max-height: 64px; }
  .cid { font-size: 11px; color: var(--soft); word-break: break-all; }
  .cname { font-size: 13px; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .cgame { font-size: 12px; font-weight: 700; color: var(--rarity, var(--green)); }
  .more { display: block; margin: 16px auto; }
  /* részletek */
  .back { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 20; padding: 12px; }
  .back[hidden] { display: none; }
  .detail { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; width: min(460px, 100%); max-height: calc(100dvh - 24px); overflow: auto; padding: 16px; }
  .detail .big { display: grid; place-items: center; min-height: 120px; background: repeating-conic-gradient(#3a3442 0 25%, #302a37 0 50%) 0 0 / 16px 16px; border-radius: 8px; padding: 10px; }
  .detail .big > * { image-rendering: pixelated; max-width: 100%; }
  .detail h2 { font-size: 18px; margin: 12px 0 4px; }
  .detail p { margin: 4px 0; font-size: 15px; }
  .detail code { font-family: var(--font); background: var(--card); padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  .detail .tags { color: var(--soft); font-size: 14px; }
  .detail .game { margin-top: 10px; padding: 10px; border-radius: 8px; border: 2px solid var(--rarity, var(--green)); }
  .detail .game b { color: var(--rarity, var(--green)); }
  .detail .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .btn { font: 600 16px var(--font); min-height: 44px; padding: 6px 16px; border-radius: 8px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--accent); color: #2a1d10; border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Asset-katalógus <small id="total"></small></h1>
  <div class="row">
    <input id="q" type="search" placeholder="Keresés: gyűrű, kard, kristály, it:867…" autocomplete="off">
  </div>
  <div class="row">
    <select id="pack" aria-label="Csomag"></select>
    <select id="cat" aria-label="Kategória"></select>
  </div>
  <div class="row" id="usage"></div>
</header>
<main>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <button class="btn more" id="more" hidden>Továbbiak</button>
</main>
<div class="back" id="back" hidden><div class="detail" id="detail"></div></div>

<script>window.Game = { data: {} };</script>
<script src="src/config/config.js"></script>
<script src="assets/catalog_data.js"></script>
<script src="data/bundle.js"></script>
<script>
(function () {
  const C = window.ASSET_CATALOG || { packs: {}, entries: [] };
  const B = window.GAME_CONTENT_BUNDLE || { items: [], strings: {} };
  const cfg = Game.data.config || { rarities: [], items: { kinds: {}, stats: {} } };
  const str = (k, lang) => (B.strings[k] && B.strings[k][lang]) || k;
  const rarity = id => cfg.rarities.find(r => r.id === id);
  const PACK_ICONS = ['it', 'wp'];

  // a játék tárgyai ikon szerint
  const used = {};
  (B.items || []).forEach(it => { (used[it.icon] = used[it.icon] || []).push(it); });
  const usedCount = Object.keys(used).length;
  document.getElementById('total').textContent = C.entries.length + ' kép · ' + (B.items || []).length + ' tárgy a játékban';

  const state = { q: '', pack: '', cat: '', usage: '' };
  let shown = 0, list = [];
  const PAGE = 150;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  // kép: ikon (16×16, a lapról kivágva) vagy fájl (az első képkocka, vagy az egész kép kicsinyítve)
  function thumb(e, size) {
    if (e.file) {
      if (e.frame) {
        const k = Math.max(1, Math.floor(size / Math.max(e.frame[0], e.frame[1])));
        const d = el('div', 'icon');
        d.style.width = e.frame[0] * k + 'px'; d.style.height = e.frame[1] * k + 'px';
        d.style.backgroundImage = 'url("' + encodeURI(e.src) + '")';
        d.style.backgroundSize = (e.w * k) + 'px ' + (e.h * k) + 'px';
        return d;
      }
      const im = el('img', 'file'); im.loading = 'lazy'; im.alt = e.id; im.src = encodeURI(e.src);
      const k = Math.max(1, Math.floor(size / Math.max(e.w, e.h)));
      if (k > 1) { im.style.width = e.w * k + 'px'; im.style.height = e.h * k + 'px'; }
      im.style.maxWidth = size + 'px'; im.style.maxHeight = size + 'px';
      return im;
    }
    const k = Math.max(1, Math.floor(size / 16));
    const d = el('div', 'icon');
    d.style.width = d.style.height = 16 * k + 'px';
    d.style.backgroundImage = 'url("' + encodeURI(e.src) + '")';
    if (e.sheet) {
      d.style.backgroundSize = (e.sheet[0] * k) + 'px ' + (e.sheet[1] * k) + 'px';
      d.style.backgroundPosition = (-e.x * k) + 'px ' + (-e.y * k) + 'px';
    } else d.style.backgroundSize = (16 * k) + 'px ' + (16 * k) + 'px';
    return d;
  }

  function matches(e) {
    if (state.pack && e.pack !== state.pack) return false;
    if (state.cat && e.cat !== state.cat) return false;
    const u = used[e.id];
    if (state.usage === 'used' && !u) return false;
    if (state.usage === 'free' && u) return false;
    if (!state.q) return true;
    const hay = norm([e.id, e.name, e.cat, (e.tags || []).join(' '), e.src].concat((u || []).map(it => str(it.name, 'de') + ' ' + str(it.name, 'hu') + ' ' + it.id)).join(' '));
    return norm(state.q).split(/\s+/).filter(Boolean).every(w => hay.includes(w));
  }

  function card(e) {
    const c = el('button', 'card');
    c.type = 'button';
    const t = el('div', 'thumb'); t.append(thumb(e, 48)); c.append(t);
    const u = used[e.id];
    if (u) {
      const r = rarity(u[0].rarity);
      c.classList.add('used');
      if (r) c.style.setProperty('--rarity', r.color);
      c.append(el('div', 'cgame', str(u[0].name, 'de')));
    }
    c.append(el('div', 'cname', e.name), el('div', 'cid', e.id));
    c.addEventListener('click', () => detail(e));
    return c;
  }

  function render(reset) {
    const grid = document.getElementById('grid');
    if (reset) { list = C.entries.filter(matches); shown = 0; grid.replaceChildren(); window.scrollTo(0, 0); }
    const frag = document.createDocumentFragment();
    list.slice(shown, shown + PAGE).forEach(e => frag.append(card(e)));
    grid.append(frag);
    shown = Math.min(list.length, shown + PAGE);
    document.getElementById('count').textContent = list.length + ' találat' + (list.length > shown ? ' · ' + shown + ' látszik' : '');
    document.getElementById('more').hidden = shown >= list.length;
  }

  function chips(box, items, key) {
    box.replaceChildren(...items.map(([v, label]) => {
      const b = el('button', 'chip' + (state[key] === v ? ' on' : ''), label);
      b.type = 'button';
      b.addEventListener('click', () => { state[key] = v; drawChips(); render(true); });
      return b;
    }));
  }
  const SHORT = { pc: 'Pixel Crawler', wp: 'Fegyver ikonok', it: 'Items16 ikonok', mi: 'Modern Interiors', t1: 'Tiny RPG 01', t2: 'Tiny RPG 02', cu: 'Saját rajzok', bg: 'Láda-hátterek' };
  function fillPacks() {
    const sel = document.getElementById('pack');
    const n = p => C.entries.filter(e => e.pack === p).length;
    sel.replaceChildren(el('option', '', 'Minden csomag'), ...Object.keys(C.packs).filter(n).map(p => { const o = el('option', '', (SHORT[p] || C.packs[p]) + ' (' + n(p) + ')'); o.value = p; return o; }));
    sel.options[0].value = '';
    sel.value = state.pack;
  }
  function drawChips() {
    chips(document.getElementById('usage'), [['', 'Mind'], ['used', 'Játékban ' + usedCount], ['free', 'Még nincs a játékban']], 'usage');
  }
  function fillCats() {
    const sel = document.getElementById('cat');
    const cats = {};
    C.entries.forEach(e => { if (!state.pack || e.pack === state.pack) cats[e.cat] = (cats[e.cat] || 0) + 1; });
    sel.replaceChildren(el('option', '', 'Minden kategória'), ...Object.keys(cats).sort((a, b) => a.localeCompare(b, 'hu')).map(c => { const o = el('option', '', c + ' (' + cats[c] + ')'); o.value = c; return o; }));
    sel.options[0].value = '';
    sel.value = state.cat;
  }

  function detail(e) {
    const d = document.getElementById('detail');
    const big = el('div', 'big'); big.append(thumb(e, e.file ? 384 : 128));
    const kids = [big, el('h2', '', e.name)];
    const idp = el('p'); idp.append('Kód: ', el('code', '', e.id)); kids.push(idp);
    kids.push(el('p', 'tags', (SHORT[e.pack] || C.packs[e.pack] || e.pack) + ' · ' + e.cat + (e.tags && e.tags.length ? ' · ' + e.tags.join(', ') : '')));
    if (e.file) kids.push(el('p', 'tags', e.src + ' · ' + e.w + '×' + e.h + ' px' + (e.frame ? ' · képkocka ' + e.frame[0] + '×' + e.frame[1] : '')));
    (used[e.id] || []).forEach(it => {
      const r = rarity(it.rarity);
      const g = el('div', 'game');
      if (r) g.style.setProperty('--rarity', r.color);
      g.append(el('b', '', str(it.name, 'de')), ' – ' + str(it.name, 'hu'));
      g.append(el('p', '', 'A játékban: ' + it.id + ' · ' + str('kind.' + it.kind, 'hu') + ' · ' + str('rarity.' + it.rarity, 'hu')));
      const st = Object.keys(it.stats || {}).map(k => '+' + it.stats[k] + ((cfg.items.stats[k] || {}).unit || '') + ' ' + str('stat.' + k, 'hu').split(' (')[0]);
      if (st.length) g.append(el('p', '', st.join(', ')));
      g.append(el('p', 'tags', 'Hely: ' + (it.places ? it.places.map(p => str('place.' + p, 'hu')).join(', ') : 'általános (bárhonnan)')));
      kids.push(g);
    });
    const copy = el('button', 'btn', 'Kód másolása');
    copy.type = 'button';
    copy.addEventListener('click', () => {
      const done = () => { copy.textContent = 'Másolva!'; };
      if (navigator.clipboard) navigator.clipboard.writeText(e.id).then(done, () => {}); else done();
    });
    const close = el('button', 'btn primary', 'Bezárás'); close.type = 'button';
    close.addEventListener('click', () => { document.getElementById('back').hidden = true; });
    const act = el('div', 'actions'); act.append(copy, close); kids.push(act);
    d.replaceChildren(...kids);
    document.getElementById('back').hidden = false;
  }
  document.getElementById('back').addEventListener('click', ev => { if (ev.target.id === 'back') ev.currentTarget.hidden = true; });

  let timer = 0;
  document.getElementById('q').addEventListener('input', ev => { clearTimeout(timer); timer = setTimeout(() => { state.q = ev.target.value.trim(); render(true); }, 200); });
  document.getElementById('cat').addEventListener('change', ev => { state.cat = ev.target.value; render(true); });
  document.getElementById('pack').addEventListener('change', ev => { state.pack = ev.target.value; state.cat = ''; fillCats(); render(true); });
  document.getElementById('more').addEventListener('click', () => render(false));
  fillPacks(); drawChips(); fillCats(); render(true);
})();
</script>
</body>
</html>
